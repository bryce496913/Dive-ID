name: iOS build and tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:redis
        env: { REDIS_TEST_URL: "redis://127.0.0.1:6379" }
      - run: npm run build
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit tests
        run: |
          xcodebuild \
            -project DiveID.xcodeproj \
            -scheme DiveID \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:DiveIDTests \
            CODE_SIGNING_ALLOWED=NO \
            clean test
