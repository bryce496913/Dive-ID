name: iOS build and tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit tests
        run: |
          xcodebuild \
            -project DiveID.xcodeproj \
            -scheme DiveID \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:DiveIDTests \
            CODE_SIGNING_ALLOWED=NO \
            clean test
