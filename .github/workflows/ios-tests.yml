name: iOS and portable tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [TropicalPacificWorkbook, CatalogImport, CatalogReview, GlobalMarineImport, FishBaseIntake, SemanticSearch/tests, CI, Evaluation]
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test dependencies
        run: python3 -m pip install -r Tools/TropicalPacificWorkbook/requirements.txt -r Tools/CatalogImport/requirements.txt
      - name: Run tooling suite
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s 'Tools/${{ matrix.suite }}' -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/python-tests.log"
      - name: Retain Python log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ strategy.job-index }}-logs
          path: ${{ runner.temp }}/python-tests.log
          retention-days: 14

  swiftpm-tests:
    name: SwiftPM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        if: ${{ runner.os == 'macOS' }}
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Run SwiftPM tests
        env:
          DIVEID_V05_REPORT: ${{ runner.temp }}/v05-evaluation.json
        shell: bash
        run: |
          set -o pipefail
          swift --version
          swift test 2>&1 | tee "$RUNNER_TEMP/swiftpm-tests.log"
      - name: Retain SwiftPM log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: swiftpm-${{ matrix.os }}-logs
          path: |
            ${{ runner.temp }}/swiftpm-tests.log
            ${{ runner.temp }}/v05-evaluation.json
          retention-days: 14

  xcode-tests:
    name: Xcode unit and UI tests
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DERIVED_DATA: ${{ github.workspace }}/.derived-data
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Resolve an iOS 18 simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project DiveID.xcodeproj -scheme DiveID -showdestinations
          udid="$({ xcrun simctl list devices available --json || exit 1; } | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, entries in devices.items():
              match = re.search(r"iOS[- ](\d+)[-.](\d+)", runtime)
              if not match or int(match.group(1)) != 18:
                  continue
              version = tuple(map(int, match.groups()))
              for device in entries:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iOS 18 iPhone simulator for Xcode 16.4 was found")
          candidates.sort(reverse=True)
          print(candidates[0][2])
          ' )"
          echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"

      - name: Resolve and validate Debug test product settings
        id: debug_settings
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        run: |
          xcodebuild -project DiveID.xcodeproj -alltargets -configuration Debug -sdk iphonesimulator -showBuildSettings -json > "$RUNNER_TEMP/settings-Debug.json" 2> "$RUNNER_TEMP/settings-Debug.log"
          python3 Tools/CI/validate_xcode_settings.py "$RUNNER_TEMP/settings-Debug.json" Debug

      - name: Resolve and validate Release test product settings
        id: release_settings
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        run: |
          xcodebuild -project DiveID.xcodeproj -alltargets -configuration Release -sdk iphonesimulator -showBuildSettings -json > "$RUNNER_TEMP/settings-Release.json" 2> "$RUNNER_TEMP/settings-Release.log"
          python3 Tools/CI/validate_xcode_settings.py "$RUNNER_TEMP/settings-Release.json" Release

      - name: Resolve and validate Internal product settings
        id: internal_settings
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        run: |
          xcodebuild -project DiveID.xcodeproj -alltargets -configuration Internal -sdk iphonesimulator -showBuildSettings -json > "$RUNNER_TEMP/settings-Internal.json" 2> "$RUNNER_TEMP/settings-Internal.log"
          python3 Tools/CI/validate_xcode_settings.py "$RUNNER_TEMP/settings-Internal.json" Internal

      - name: Build application and tests
        id: build
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project DiveID.xcodeproj \
            -scheme DiveID \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/Build.xcresult" \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Run complete unit-test target
        id: unit_tests
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project DiveID.xcodeproj \
            -scheme DiveID \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/DiveIDTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            test-without-building \
            -only-testing:DiveIDTests 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Run hosted application-bundle packaging test explicitly
        id: packaging
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project DiveID.xcodeproj \
            -scheme DiveID \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/DiveIDHostedPackagingTest.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            test-without-building \
            -only-testing:DiveIDTests/TropicalPacificCatalogueTests/testProductionRepositoryLoadsTropicalPacificFromBuiltApplicationBundle 2>&1 | tee "$RUNNER_TEMP/packaging-test.log"

      - name: Run UI-test target
        id: ui_tests
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project DiveID.xcodeproj \
            -scheme DiveID \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/DiveIDUITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            test-without-building \
            -only-testing:DiveIDUITests 2>&1 | tee "$RUNNER_TEMP/ui-tests.log"

      - name: Build the Internal application (optimized, development catalogue)
        id: internal_build
        if: ${{ always() && steps.internal_settings.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project DiveID.xcodeproj \
            -scheme DiveID \
            -configuration Internal \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA-internal" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/internal-build.log"

      - name: Build the Release application
        id: release_build
        if: ${{ always() && steps.release_settings.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project DiveID.xcodeproj \
            -scheme DiveID \
            -configuration Release \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA-release" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/release-build.log"

      # First-use instrumentation is Debug and Internal only (SearchPerformanceInstrumentation.swift).
      - name: Check instrumentation is absent from Release and present in Debug and Internal
        id: instrumentation
        if: ${{ always() && steps.build.outcome == 'success' && steps.internal_build.outcome == 'success' && steps.release_build.outcome == 'success' }}
        run: |
          set -e
          python3 Tools/CI/check_internal_instrumentation.py --expect absent "$DERIVED_DATA-release/Build/Products/Release-iphonesimulator/DiveID.app"
          python3 Tools/CI/check_internal_instrumentation.py --expect present "$DERIVED_DATA-internal/Build/Products/Internal-iphonesimulator/DiveID.app"
          python3 Tools/CI/check_internal_instrumentation.py --expect present "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/DiveID.app"

      - name: Export hosted result summaries
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          status=0
          for stage in DiveIDTests DiveIDHostedPackagingTest DiveIDUITests; do
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$stage.xcresult" > "$RUNNER_TEMP/$stage-summary.json" || status=1
            cat "$RUNNER_TEMP/$stage-summary.json" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

      - name: Summarize hosted outcomes
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Tested SHA: `${{ github.sha }}`

          | Stage | Outcome |
          | --- | --- |
          | Debug settings | ${{ steps.debug_settings.outcome }} |
          | Release settings | ${{ steps.release_settings.outcome }} |
          | Internal settings | ${{ steps.internal_settings.outcome }} |
          | Build | ${{ steps.build.outcome }} |
          | Complete unit target | ${{ steps.unit_tests.outcome }} |
          | Hosted packaging | ${{ steps.packaging.outcome }} |
          | UI target | ${{ steps.ui_tests.outcome }} |
          | Internal build | ${{ steps.internal_build.outcome }} |
          | Release build | ${{ steps.release_build.outcome }} |
          | Instrumentation absent from Release | ${{ steps.instrumentation.outcome }} |
          SUMMARY

      - name: Upload Xcode logs, settings and result bundles
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: |
            ${{ runner.temp }}/*.xcresult
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/settings-*.json
            ${{ runner.temp }}/*-summary.json
          if-no-files-found: ignore
          retention-days: 14

  validation:
    name: Required validation
    if: ${{ always() }}
    needs: [python-tests, swiftpm-tests, xcode-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          SWIFTPM_RESULT: ${{ needs.swiftpm-tests.result }}
          XCODE_RESULT: ${{ needs.xcode-tests.result }}
        run: |
          printf 'Python: %s\nSwiftPM: %s\nXcode: %s\n' "$PYTHON_RESULT" "$SWIFTPM_RESULT" "$XCODE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$PYTHON_RESULT" = success
          test "$SWIFTPM_RESULT" = success
          test "$XCODE_RESULT" = success
