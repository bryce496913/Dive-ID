name: iOS and portable tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [TropicalPacificWorkbook, CatalogImport, CatalogReview, GlobalMarineImport, FishBaseIntake, SpeciesPhotos, SemanticSearch/tests, CI, Evaluation]
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test dependencies
        run: python3 -m pip install -r Tools/TropicalPacificWorkbook/requirements.txt -r Tools/CatalogImport/requirements.txt
      - name: Run tooling suite
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s 'Tools/${{ matrix.suite }}' -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/python-tests.log"
      - name: Retain Python log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ strategy.job-index }}-logs
          path: ${{ runner.temp }}/python-tests.log
          retention-days: 14

  validation:
    name: Required validation
    if: ${{ always() }}
    needs: [python-tests]
    runs-on: ubuntu-latest
    steps:
      # SwiftPM jobs were removed on 2026-11-04 (Bryce's decision): Swift tests run on a Mac
      # and a device, as described in README "Required portable checks".
      - name: Require every validation job to succeed
        env:
          PYTHON_RESULT: ${{ needs.python-tests.result }}
        run: |
          printf 'Python: %s\n' "$PYTHON_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$PYTHON_RESULT" = success
