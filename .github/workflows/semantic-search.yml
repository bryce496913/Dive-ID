name: Semantic search (Core ML)

# Builds the pinned MiniLM encoder into Core ML for the Global pack and proves the
# experimental semantic path really runs. The model is never committed: it is rebuilt
# here and kept as a workflow artifact for private Debug builds. BM25 stays the default.
# Pushes to main rebuild it whenever catalogue or search content changes, so a fresh
# artifact matches the current Global records (a stale index falls back to BM25).
on:
  push:
    branches: [main]
    paths:
      - 'Tools/SemanticSearch/**'
      - 'DiveID/Core/Services/*Semantic*.swift'
      - 'DiveID/Core/Services/DescriptionSearchEngine.swift'
      - 'DiveID/Core/Services/SpeciesCandidateRetriever.swift'
      - 'DiveID/Core/Services/LocalSpeciesRanker.swift'
      - 'DiveID/Core/Services/SearchIndexStore.swift'
      - 'DiveID/Core/Models/SpeciesSearchDocument.swift'
      - 'DiveID/Resources/IdentificationPacks/Global/**'
      - 'DiveIDTests/SemanticEndToEndTests.swift'
      - '.github/workflows/semantic-search.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Tools/SemanticSearch/**'
      - 'DiveID/Core/Services/*Semantic*.swift'
      - 'DiveID/Core/Services/DescriptionSearchEngine.swift'
      - 'DiveID/Core/Services/SpeciesCandidateRetriever.swift'
      - 'DiveID/Core/Services/LocalSpeciesRanker.swift'
      - 'DiveID/Core/Services/SearchIndexStore.swift'
      - 'DiveID/Core/Models/SpeciesSearchDocument.swift'
      - 'DiveID/Resources/IdentificationPacks/Global/**'
      - 'DiveIDTests/SemanticEndToEndTests.swift'
      - '.github/workflows/semantic-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision-and-verify:
    name: Provision encoder and verify semantic search
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RESOURCES: ${{ github.workspace }}/.semantic-resources
      DERIVED_DATA: ${{ github.workspace }}/.derived-data
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: Tools/SemanticSearch/requirements-real-encoder.txt

      # Every package, transitive ones included, is pinned and hash-checked: an unpinned
      # NumPy 2.5 once broke conversion (see requirements-real-encoder.in).
      - name: Install hash-locked encoder tooling
        shell: bash
        run: |
          python3 -m pip install --require-hashes -r Tools/SemanticSearch/requirements-real-encoder.txt
          {
            echo '### Conversion environment'
            echo '```'
            sw_vers
            xcodebuild -version
            python3 --version
            python3 -m pip freeze | grep -iE '^(coremltools|numpy|torch|transformers|tokenizers|safetensors|huggingface.hub|protobuf)=='
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Convert the encoder architecture with coremltools (integration check)
        env:
          DIVEID_REQUIRE_CONVERSION: '1'
        run: python3 -m unittest -v Tools/SemanticSearch/tests/test_coreml_conversion.py

      - name: Provision, convert, compile and package the Global encoder
        id: provision
        shell: bash
        run: |
          set -o pipefail
          python3 Tools/SemanticSearch/provision_real_encoder.py \
            --pack DiveID/Resources/IdentificationPacks/Global \
            --package-resources "$RESOURCES" 2>&1 | tee "$RUNNER_TEMP/provision.log"
          ls -la "$RESOURCES"
          python3 - "$RESOURCES/provisioning-evidence.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          evidence = json.load(open(sys.argv[1]))
          parity = evidence["parity"]
          print("### Core ML parity (frozen tolerances, Tools/SemanticSearch/coreml-parity.v1.json)")
          print(f"- Status: {parity['status']} on {parity['report']['probes']} probes, compute units {parity['computeUnits']}")
          print("```json"); print(json.dumps(parity["report"]["summary"], indent=2, sort_keys=True)); print("```")
          print("### Artifact identities")
          print("```json"); print(json.dumps(dict(evidence["identities"], compiledModelSHA256=evidence["compiledModel"]["sha256"],
                                                  parityFixtureSHA256=parity["fixture"]["sha256"]), indent=2, sort_keys=True)); print("```")
          PY
          {
            echo '### Packaged semantic resources'
            echo '```'
            du -sh "$RESOURCES"/* "$RESOURCES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify provisioning evidence against the packaged resources
        run: |
          python3 Tools/SemanticSearch/validate_production_readiness.py \
            Tools/SemanticSearch/production-readiness.v1.json \
            --provisioning-evidence "$RESOURCES/provisioning-evidence.json" \
            --packaged-resources "$RESOURCES"

      - name: SwiftPM end-to-end semantic search on Global
        id: swiftpm
        if: ${{ always() && steps.provision.outcome == 'success' }}
        shell: bash
        env:
          DIVEID_SEMANTIC_RESOURCES: ${{ github.workspace }}/.semantic-resources
          DIVEID_SEMANTIC_REPORT: ${{ runner.temp }}/semantic-merge-global.json
          DIVEID_SEMANTIC_DISTRIBUTION: ${{ runner.temp }}/semantic-distribution-global.json
        run: |
          set -o pipefail
          swift test --filter SemanticEndToEndTests 2>&1 | tee "$RUNNER_TEMP/swiftpm-semantic.log"
          # A skipped test is not evidence: the parity and merge tests must have run and passed.
          grep -q "testAppEncoderMatchesTheProvisioningReference\]' passed" "$RUNNER_TEMP/swiftpm-semantic.log"
          grep -q "testProvisionedEncoderComplementsBM25OnGlobal\]' passed" "$RUNNER_TEMP/swiftpm-semantic.log"
          grep -E '^SEMANTIC-PARITY' "$RUNNER_TEMP/swiftpm-semantic.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize calibration and merge reports
        if: ${{ always() && steps.provision.outcome == 'success' }}
        shell: bash
        run: |
          # A skipped test is not evidence: require the reports the tests write after running.
          test -s "$RUNNER_TEMP/semantic-merge-global.json"
          test -s "$RUNNER_TEMP/semantic-distribution-global.json"
          python3 - "$RUNNER_TEMP/semantic-merge-global.json" "$RUNNER_TEMP/semantic-distribution-global.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report, distribution = (json.load(open(path)) for path in sys.argv[1:3])
          rows = report["rows"]
          embedding = sorted(row["embeddingMilliseconds"] for row in rows)
          retrieval = sorted(row["retrievalMilliseconds"] for row in rows)
          print("### Raw cosine distribution on Global (development descriptions)")
          print("```json"); print(json.dumps(distribution["summary"], indent=2, sort_keys=True)); print("```")
          print("### Merged semantic + BM25 on Global")
          print(f"- Cases: {report['cases']} on {report['speciesCount']} species ({report['pack']})")
          print(f"- Expected species top-1: BM25 {report['expectedTop1BM25']}, merged {report['expectedTop1Merged']}")
          print(f"- Top result changed vs BM25: {report['top1Changed']}")
          print(f"- Cases showing a species BM25 did not retrieve: {report['casesWithSemanticOnlyResults']}")
          print(f"- No-match cases that gained results (must be 0): {report['noMatchCasesThatGainedResults']}")
          print(f"- Requested engine: {report['requestedEngine']}; served by Core ML: {report['casesServedByCoreML']}/{report['cases']}; "
                f"fallbacks: {report['fallbackCount']} {report['fallbackReasons']}")
          print(f"- Abstention vs BM25: newly answered {report['newlyAnswered']}, newly abstained {report['newlyAbstained']}")
          print(f"- Semantic-only results that are not the expected species: {report['addedUnexpectedResults']} "
                f"by kind {report['addedUnexpectedResultsByKind']}; highest confidence shown for one: {report['maximumSemanticOnlyConfidence']}")
          print(f"- Cases whose expected species came only from semantic retrieval: {report['casesWithExpectedOnlyFromSemantic']}")
          kinds = sorted({row['kind'] for row in rows})
          print("| Kind | Cases | Expected top-1 BM25 | Expected top-1 merged | Abstained BM25 | Abstained merged | Unexpected semantic-only |")
          print("| --- | --- | --- | --- | --- | --- | --- |")
          for kind in kinds:
              subset = [row for row in rows if row['kind'] == kind]
              print(f"| {kind} | {len(subset)} | {sum(r['expectedTop1BM25'] for r in subset)} | {sum(r['expectedTop1Merged'] for r in subset)} | "
                    f"{sum(r['bm25Abstained'] for r in subset)} | {sum(r['mergedAbstained'] for r in subset)} | "
                    f"{sum(r['semanticOnlyUnexpected'] for r in subset)} |")
          print(f"- macOS runner, Debug SwiftPM: embedding median {embedding[len(embedding) // 2]:.1f} ms, "
                f"scoring median {retrieval[len(retrieval) // 2]:.1f} ms, first load {rows[0]['loadMilliseconds']:.0f} ms")
          PY

      - name: Bundle resources into the app and run the hosted semantic test
        id: hosted
        if: ${{ always() && steps.provision.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p DiveID/Resources/SemanticSearch
          cp -R "$RESOURCES"/. DiveID/Resources/SemanticSearch/
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          found = []
          for runtime, entries in json.load(sys.stdin)["devices"].items():
              match = re.search(r"iOS[- ](\d+)[-.](\d+)", runtime)
              if match and int(match.group(1)) == 18:
                  found += [(tuple(map(int, match.groups())), d["udid"]) for d in entries
                            if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]
          print(sorted(found, reverse=True)[0][1])
          ')"
          xcodebuild -project DiveID.xcodeproj -scheme DiveID -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee "$RUNNER_TEMP/hosted-build.log"
          app="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/DiveID.app"
          test -d "$app/Semantic-global.mlmodelc"
          test -f "$app/Semantic-global.index.json"
          test -f "$app/Semantic-global.parity.json"
          python3 Tools/SemanticSearch/validate_production_readiness.py \
            Tools/SemanticSearch/production-readiness.v1.json \
            --provisioning-evidence "$app/provisioning-evidence.json" --packaged-resources "$app"
          export TEST_RUNNER_DIVEID_REQUIRE_SEMANTIC=1
          xcodebuild -project DiveID.xcodeproj -scheme DiveID -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath "$DERIVED_DATA" -resultBundlePath "$RUNNER_TEMP/SemanticHosted.xcresult" \
            CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO test-without-building \
            -only-testing:DiveIDTests/SemanticEndToEndTests/testBundledArtifactsServeTheExperimentalSelection \
            -only-testing:DiveIDTests/SemanticEndToEndTests/testAppEncoderMatchesTheProvisioningReference \
            2>&1 | tee "$RUNNER_TEMP/hosted-test.log"
          # A skipped test is not evidence: both hosted tests must have run and passed.
          grep -q "testBundledArtifactsServeTheExperimentalSelection\]' passed" "$RUNNER_TEMP/hosted-test.log"
          grep -q "testAppEncoderMatchesTheProvisioningReference\]' passed" "$RUNNER_TEMP/hosted-test.log"
          grep -E '^SEMANTIC-(ENGINE|PARITY)' "$RUNNER_TEMP/hosted-test.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          | Stage | Outcome |
          | --- | --- |
          | Provision and package | ${{ steps.provision.outcome }} |
          | SwiftPM end-to-end | ${{ steps.swiftpm.outcome }} |
          | Hosted app bundle | ${{ steps.hosted.outcome }} |

          Production default remains BM25; the readiness ledger stays unapproved.
          SUMMARY

      - name: Upload packaged resources (for private Debug builds) and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: semantic-global-resources
          path: |
            .semantic-resources
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/semantic-*-global.json
            ${{ runner.temp }}/SemanticHosted.xcresult
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
