# TEMPORARY: regenerates the Global search golden file and the opt-in Global evaluation
# report for the owner-additions PR (no Swift toolchain in the authoring environment),
# and commits them to the PR branch. Removed before review.
name: Temporary Global fixture regeneration

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/tmp-regenerate-global-fixtures.yml"]

jobs:
  regenerate:
    if: ${{ github.head_ref == 'claude/project-thread-2qwmkc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Regenerate SearchGolden.v2.json and GlobalPackEvaluation.json
        shell: bash
        run: |
          set -o pipefail
          swift --version
          DIVEID_WRITE_SEARCH_GOLDEN="$PWD/DiveIDTests/Fixtures/SearchGolden.v2.json" \
            swift test -c release --filter SearchGoldenOrderingTests 2>&1 | tail -20
          DIVEID_GLOBAL_EVAL_REPORT="$PWD/Reports/GlobalPackEvaluation.json" \
            swift test -c release --filter GlobalPackEvaluationTests 2>&1 | tail -40 || true
          git diff --stat
      - name: Commit the regenerated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898313+github-actions[bot]@users.noreply.github.com"
          git add DiveIDTests/Fixtures/SearchGolden.v2.json Reports/GlobalPackEvaluation.json
          git diff --cached --quiet || git commit -m "Regenerate the Global search golden file and evaluation report (CI, temporary workflow)"
          git push origin HEAD:${{ github.head_ref }}
