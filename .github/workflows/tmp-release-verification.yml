# TEMPORARY: Release-configuration evidence for the Global approval PR. Removed before review.
name: Temporary Release verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  swiftpm-release:
    name: swift test -c release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        if: ${{ runner.os == 'macOS' }}
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Run SwiftPM tests in Release
        shell: bash
        run: |
          set -o pipefail
          swift --version
          swift test -c release 2>&1 | tee "$RUNNER_TEMP/swiftpm-release.log"
          grep -E "GLOBAL_RELEASE|PUBLICATION_GATE" "$RUNNER_TEMP/swiftpm-release.log" || true

  xcode-release-build:
    name: Xcode Release build (simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Build the DiveID scheme in Release for the iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project DiveID.xcodeproj -scheme DiveID -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -30
